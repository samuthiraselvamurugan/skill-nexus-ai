<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKILLNEXUS AI — Cinematic 3D Career Intelligence</title>
  <meta name="description" content="VR-inspired 3D AI career operating system with ChatGPT-style AI Mentor, Orbital Course Universe, and 6 autonomous AI agents." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050711'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2300E5FF' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%238B5CF6'/%3E%3C/svg%3E" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

    :root {
      --space-black: #050711;
      --midnight: #080F24;
      --cyan: #00E5FF;
      --neon-blue: #1677FF;
      --purple: #8B5CF6;
      --soft-white: #EAF6FF;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--space-black);
      color: var(--soft-white);
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* DOUBLE-COLOR GLOWING TEXT (CYAN + PURPLE) */
    .glow-dual {
      background: linear-gradient(95deg, #00E5FF 0%, #EAF6FF 42%, #8B5CF6 100%);
      background-size: 200% auto;
      animation: holoFlow 5s linear infinite;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.55)) drop-shadow(0 0 18px rgba(139, 92, 246, 0.52));
    }

    .glow-dual-soft {
      background: linear-gradient(95deg, #00E5FF 0%, #8B5CF6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.45)) drop-shadow(0 0 14px rgba(139, 92, 246, 0.45));
    }

    .glow-word-white {
      color: #EAF6FF;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.48), 0 0 22px rgba(139, 92, 246, 0.45);
    }

    /* Cinematic Universe Backdrop */
    .vr-universe {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 16% 12%, rgba(0, 229, 255, 0.14), transparent 38%),
        radial-gradient(circle at 84% 18%, rgba(139, 92, 246, 0.18), transparent 42%),
        radial-gradient(circle at 50% 88%, rgba(22, 119, 255, 0.15), transparent 45%),
        linear-gradient(180deg, #050711 0%, #080F24 55%, #050711 100%);
    }

    .vr-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(0, 229, 255, 0.055) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(139, 92, 246, 0.055) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 82%);
    }

    .holo-scanline {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 229, 255, 0.015) 4px
      );
    }

    .cursor-aura {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 999px;
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0, 229, 255, 0.09), rgba(139, 92, 246, 0.05) 45%, transparent 72%);
    }

    /* Reflective 3D Glass */
    .vr-glass {
      position: relative;
      background: linear-gradient(155deg, rgba(12, 21, 48, 0.76), rgba(5, 7, 17, 0.90));
      border: 1px solid rgba(0, 229, 255, 0.22);
      border-radius: 22px;
      padding: 1.35rem;
      backdrop-filter: blur(22px);
      box-shadow: 0 24px 60px -22px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(234, 246, 255, 0.11);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .vr-glass:hover {
      border-color: rgba(0, 229, 255, 0.48);
      box-shadow: 0 26px 70px -18px rgba(0, 229, 255, 0.24), inset 0 1px 0 rgba(234, 246, 255, 0.18);
    }

    .holo-rim { position: relative; isolation: isolate; }
    .holo-rim::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(125deg, #00E5FF, #1677FF, #8B5CF6, #00E5FF);
      background-size: 260% 260%;
      animation: holoFlow 6s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: -1;
      opacity: 0.76;
    }
    @keyframes holoFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ai-flow-line {
      stroke-dasharray: 8 6;
      animation: aiStream 1.4s linear infinite;
    }
    @keyframes aiStream {
      from { stroke-dashoffset: 28; }
      to { stroke-dashoffset: 0; }
    }

    .planetarium-3d { perspective: 1100px; }
    .planetarium-plane {
      transform: rotateX(16deg);
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .planetarium-3d:hover .planetarium-plane { transform: rotateX(6deg); }

    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbitCounterSpin {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .orbit-ring { animation: orbitSpin var(--dur, 26s) linear infinite; }
    .orbit-planet-counter { animation: orbitCounterSpin var(--dur, 26s) linear infinite; }
    .universe-stage:hover .orbit-ring,
    .universe-stage:hover .orbit-planet-counter { animation-play-state: paused; }

    .btn-vr {
      background: linear-gradient(110deg, #00E5FF 0%, #1677FF 50%, #8B5CF6 100%);
      background-size: 200% auto;
      color: #050711;
      font-weight: 800;
      border-radius: 14px;
      box-shadow: 0 0 26px rgba(0, 229, 255, 0.38);
      transition: all 0.28s ease;
    }
    .btn-vr:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 0 38px rgba(139, 92, 246, 0.55);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .eyebrow i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }

    @keyframes cinematicWarp {
      0% { opacity: 0; transform: perspective(1000px) translateZ(-40px) translateY(16px) scale(0.97); filter: blur(6px); }
      100% { opacity: 1; transform: perspective(1000px) translateZ(0px) translateY(0px) scale(1); filter: blur(0px); }
    }
    .page-transition-3d {
      animation: cinematicWarp 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    .float-hud { animation: floatSlow 5.2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.62rem 0.9rem;
      border-radius: 12px;
      font-size: 0.87rem;
      font-weight: 500;
      color: #94a3b8;
      transition: all 0.2s ease;

    .nav-btn:hover { color: var(--soft-white); background: rgba(0, 229, 255, 0.08); }
    .nav-btn.active {
      color: var(--soft-white);
      background: linear-gradient(90deg, rgba(0, 229, 255, 0.20), rgba(139, 92, 246, 0.18));
      border: 1px solid rgba(0, 229, 255, 0.45);
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.18);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050711; }
    ::-webkit-scrollbar-thumb { background: #172554; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #00E5FF; }
  </style>
</head>

    const Icons = {

      Orbit: (p) => <SvgIcon {...p} d={["M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0-6 0", "M19.4 4.6c2.7 2.7 1.2 8.7-3.4 13.3S5.5 24 2.8 21.3 1.6 12.6 6.2 8 16.7 1.9 19.4 4.6z"]} />,

    // ---------------- CINEMATIC 3D WARP STARFIELD ----------------
    function CinematicStarWarp({ lowMotion = false }) {
      const ref = useRef(null);
      useEffect(() => {
        if (lowMotion) return;
        const canvas = ref.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let id = 0;
        const palette = ["#00E5FF", "#1677FF", "#8B5CF6", "#EAF6FF"];
        const stars = Array.from({ length: 120 }, () => ({
          x: (Math.random() - 0.5) * 1800,
          y: (Math.random() - 0.5) * 1100,
          z: Math.random() * 1100 + 40,
          pz: 1100,
          c: palette[Math.floor(Math.random() * palette.length)],
        }));

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener("resize", resize);

        const loop = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const cx = canvas.width / 2, cy = canvas.height / 2;
          stars.forEach((s) => {
            s.pz = s.z;
            s.z -= 2.6;
            if (s.z <= 20) {
              s.z = 1100; s.pz = 1100;
              s.x = (Math.random() - 0.5) * 1800;
              s.y = (Math.random() - 0.5) * 1100;
            }
            const k = 340 / s.z, pk = 340 / s.pz;
            ctx.strokeStyle = s.c;
            ctx.globalAlpha = Math.min(0.75, (1 - s.z / 1100) + 0.12);
            ctx.lineWidth = Math.max(0.8, (1 - s.z / 1100) * 2.4);
            ctx.beginPath();
            ctx.moveTo(cx + s.x * pk, cy + s.y * pk);
            ctx.lineTo(cx + s.x * k, cy + s.y * k);
            ctx.stroke();
          });
          ctx.globalAlpha = 1;
          id = requestAnimationFrame(loop);
        };
        id = requestAnimationFrame(loop);
        return () => { cancelAnimationFrame(id); window.removeEventListener("resize", resize); };
      }, [lowMotion]);

      if (lowMotion) return null;
      return <canvas ref={ref} className="pointer-events-none fixed inset-0 z-0 opacity-55" />;
    }

    // ---------------- ANIMATED 2D-CANVAS 3D BRAIN FALLBACK (IF WEBGL UNAVAILABLE) ----------------
    function CanvasBrainFallback({ height = 380, lowMotion = false }) {
      const ref = useRef(null);
      useEffect(() => {
        const canvas = ref.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let id = 0, t = 0;
        const pts = Array.from({ length: 34 }, (_, i) => {
          const phi = Math.acos(1 - (2 * (i + 0.5)) / 34);
          const theta = Math.PI * (1 + Math.sqrt(5)) * i;
          return {
            x: Math.sin(phi) * Math.cos(theta) * 95,
            y: Math.cos(phi) * 85,
            z: Math.sin(phi) * Math.sin(theta) * 95,
            c: i % 2 === 0 ? "#00E5FF" : "#8B5CF6",
          };
        });
        const resize = () => {
          canvas.width = canvas.clientWidth || 420;
          canvas.height = height;
        };
        resize();
        const render = () => {
          if (!lowMotion) t += 0.016;
          const w = canvas.width, h = canvas.height;
          ctx.clearRect(0, 0, w, h);
          const cos = Math.cos(t), sin = Math.sin(t);
          const proj = pts.map((p) => {
            const rx = p.x * cos - p.z * sin;
            const rz = p.z * cos + p.x * sin;
            const sc = 280 / (280 + rz + 120);
            return { sx: w / 2 + rx * sc, sy: h / 2 + p.y * sc, sc, c: p.c };
          });
          for (let i = 0; i < proj.length; i++) {
            for (let j = i + 1; j < proj.length; j++) {
              if (Math.hypot(proj[i].sx - proj[j].sx, proj[i].sy - proj[j].sy) < 88) {
                ctx.strokeStyle = i % 2 === 0 ? "rgba(0,229,255,0.28)" : "rgba(139,92,246,0.28)";
                ctx.beginPath();
                ctx.moveTo(proj[i].sx, proj[i].sy);
                ctx.lineTo(proj[j].sx, proj[j].sy);
                ctx.stroke();
              }
            }
          }
          proj.forEach((p) => {
            ctx.fillStyle = p.c;
            ctx.shadowColor = p.c;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(p.sx, p.sy, 3.6 * p.sc, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          });
          id = requestAnimationFrame(render);
        };
        id = requestAnimationFrame(render);
        return () => cancelAnimationFrame(id);
      }, [height, lowMotion]);
      return <canvas ref={ref} className="w-full" style={{ height }} />;
    }

    // ---------------- CINEMATIC THREE.JS 3D HOLOGRAPHIC AI BRAIN ----------------
    function HolographicBrain3D({ height = 390, lowMotion = false }) {
      const mountRef = useRef(null);
      const [useCanvasFallback, setUseCanvasFallback] = useState(false);

      useEffect(() => {
        if (lowMotion || !window.THREE) {
          setUseCanvasFallback(true);
          return;
        }
        setUseCanvasFallback(false);
        const container = mountRef.current;
        if (!container) return;

        let renderer, animId, disposed = false;
        try {
          const THREE = window.THREE;
          const scene = new THREE.Scene();
          const w = container.clientWidth || 460;
          const h = height;
          const camera = new THREE.PerspectiveCamera(46, w / h, 0.1, 100);
          camera.position.set(0, 0.4, 9.6);

          renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
          if (!renderer.getContext()) throw new Error("No WebGL");
          renderer.setSize(w, h);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          container.innerHTML = "";
          container.appendChild(renderer.domElement);

          const cyanLight = new THREE.PointLight(0x00E5FF, 2.8, 22);
          cyanLight.position.set(3.5, 2.2, 4);
          const purpleLight = new THREE.PointLight(0x8B5CF6, 2.8, 22);
          purpleLight.position.set(-3.5, -2.2, 3);
          scene.add(cyanLight, purpleLight, new THREE.AmbientLight(0x1677FF, 0.85));

          const brainGroup = new THREE.Group();
          scene.add(brainGroup);

          const cortexGeo = new THREE.IcosahedronGeometry(1.38, 2);
          const leftHemi = new THREE.Mesh(cortexGeo, new THREE.MeshBasicMaterial({ color: 0x00E5FF, wireframe: true, transparent: true, opacity: 0.48 }));
          leftHemi.scale.set(0.76, 1.0, 1.15);
          leftHemi.position.x = -0.35;

          const rightHemi = new THREE.Mesh(cortexGeo, new THREE.MeshBasicMaterial({ color: 0x8B5CF6, wireframe: true, transparent: true, opacity: 0.42 }));
          rightHemi.scale.set(0.76, 1.0, 1.15);
          rightHemi.position.x = 0.35;

          const coreMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.58, 24, 24),
            new THREE.MeshStandardMaterial({ color: 0x1677FF, emissive: 0x00E5FF, emissiveIntensity: 1.45, transparent: true, opacity: 0.68 })
          );
          brainGroup.add(leftHemi, rightHemi, coreMesh);

          const lineVerts = [];
          const posAttr = cortexGeo.attributes.position;
          const nodeGeo = new THREE.SphereGeometry(0.038, 8, 8);
          const nodeMat = new THREE.MeshBasicMaterial({ color: 0xEAF6FF });
          for (let i = 0; i < posAttr.count; i += 4) {
            const vx = posAttr.getX(i) * 0.8 + (posAttr.getX(i) < 0 ? -0.32 : 0.32);
            const vy = posAttr.getY(i);
            const vz = posAttr.getZ(i) * 1.15;
            const dot = new THREE.Mesh(nodeGeo, nodeMat);
            dot.position.set(vx, vy, vz);
            brainGroup.add(dot);
            if (i % 8 === 0) lineVerts.push(0, 0, 0, vx, vy, vz);
          }
          const synGeo = new THREE.BufferGeometry();
          synGeo.setAttribute("position", new THREE.Float32BufferAttribute(lineVerts, 3));
          const synMat = new THREE.LineBasicMaterial({ color: 0x00E5FF, transparent: true, opacity: 0.55 });
          brainGroup.add(new THREE.LineSegments(synGeo, synMat));

          const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.016, 12, 90), new THREE.MeshBasicMaterial({ color: 0x00E5FF, transparent: true, opacity: 0.55 }));
          ring1.rotation.x = Math.PI / 2.6;
          const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.45, 0.013, 12, 90), new THREE.MeshBasicMaterial({ color: 0x8B5CF6, transparent: true, opacity: 0.45 }));
          ring2.rotation.y = Math.PI / 3;
          const ring3 = new THREE.Mesh(new THREE.TorusGeometry(2.75, 0.010, 12, 90), new THREE.MeshBasicMaterial({ color: 0x1677FF, transparent: true, opacity: 0.35 }));
          ring3.rotation.z = Math.PI / 4;
          scene.add(ring1, ring2, ring3);

          const pCount = 220;
          const pPositions = new Float32Array(pCount * 3);
          for (let i = 0; i < pCount; i++) {
            const r = 1.9 + Math.random() * 2.2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            pPositions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            pPositions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pPositions[i * 3 + 2] = r * Math.cos(phi);
          }
          const pGeo = new THREE.BufferGeometry();
          pGeo.setAttribute("position", new THREE.BufferAttribute(pPositions, 3));
          const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x00E5FF, size: 0.05, transparent: true, opacity: 0.85 }));
          scene.add(particles);

          const mouse = { x: 0, y: 0 };
          const onMove = (e) => {
            const rect = container.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width - 0.5) * 1.6;
            mouse.y = ((e.clientY - rect.top) / rect.height - 0.5) * 1.2;
          };
          container.addEventListener("pointermove", onMove);

          const onResize = () => {
            if (!container || disposed) return;
            const nw = container.clientWidth || 460;
            camera.aspect = nw / h;
            camera.updateProjectionMatrix();
            renderer.setSize(nw, h);
          };
          window.addEventListener("resize", onResize);

          let t = 0;
          const animate = () => {
            if (disposed) return;
            t += 0.013;
            camera.position.z += (5.15 - camera.position.z) * 0.045;
            camera.position.y += (Math.sin(t * 0.6) * 0.14 - camera.position.y) * 0.04;
            camera.lookAt(0, 0, 0);

            brainGroup.rotation.y += (t * 0.42 + mouse.x - brainGroup.rotation.y) * 0.05;
            brainGroup.rotation.x += (mouse.y * 0.5 - brainGroup.rotation.x) * 0.05;
            coreMesh.scale.setScalar(1 + Math.sin(t * 2.8) * 0.1);
            synMat.opacity = 0.35 + (Math.sin(t * 3.2) + 1) * 0.22;

            ring1.rotation.z = t * 0.42;
            ring2.rotation.x = t * 0.32;
            ring3.rotation.y = -t * 0.25;
            particles.rotation.y = -t * 0.16;

            renderer.render(scene, camera);
            animId = requestAnimationFrame(animate);
          };
          animId = requestAnimationFrame(animate);

          return () => {
            disposed = true;
            cancelAnimationFrame(animId);
            window.removeEventListener("resize", onResize);
            container.removeEventListener("pointermove", onMove);
            renderer.dispose();
          };
        } catch (err) {
          setUseCanvasFallback(true);
        }
      }, [height, lowMotion]);

      if (useCanvasFallback) return <CanvasBrainFallback height={height} lowMotion={lowMotion} />;
      return <div ref={mountRef} className="w-full cursor-grab active:cursor-grabbing" style={{ height }} />;
    }

    function formatInlineText(str) {
      return str.split(/(\*\*.*?\*\*|`[^`]+`)/g).map((seg, si) => {
        if (seg.indexOf("**") === 0 && seg.endsWith("**")) {
          return <strong key={si} className="glow-word-white font-bold">{seg.slice(2, -2)}</strong>;
        }
        if (seg.indexOf("`") === 0 && seg.endsWith("`")) {
          return <code key={si} className="mono rounded bg-slate-800 px-1.5 py-0.5 text-xs text-cyan-300">{seg.slice(1, -1)}</code>;
        }
        return seg;
      });
    }

    function RichMessageRenderer({ text, onCopy }) {
      const parts = text.split(/```(\w*)\n([\s\S]*?)```/g);
      const elements = [];
      for (let i = 0; i < parts.length; i += 3) {
        const markdownChunk = parts[i] || "";
        const lang = parts[i + 1];
        const codeBlock = parts[i + 2];

        if (markdownChunk.trim()) {
          const lines = markdownChunk.split("\n");
          elements.push(
            <div key={`txt-${i}`} className="space-y-1.5 text-sm leading-relaxed">
              {lines.map((line, li) => {
                if (line.indexOf("### ") === 0) {
                  return <h4 key={li} className="glow-dual-soft pt-1 text-base font-extrabold">{line.replace("### ", "")}</h4>;
                }
                if (line.indexOf("- ") === 0) {
                  return (
                    <div key={li} className="flex gap-2 pl-1">
                      <span className="text-cyan-400">•</span>
                      <span>{formatInlineText(line.slice(2))}</span>
                    </div>
                  );
                }
                return line.trim() ? <p key={li}>{formatInlineText(line)}</p> : <div key={li} className="h-1" />;
              })}
            </div>
          );
        }

        if (codeBlock !== undefined) {
          elements.push(
            <div key={`code-${i}`} className="my-2.5 overflow-hidden rounded-xl border border-cyan-500/30 bg-[#050711]">
              <div className="flex items-center justify-between border-b border-slate-800 bg-[#080F24] px-3 py-1.5 text-[10px] text-cyan-300">
                <span className="mono font-bold uppercase">{lang || "code"}</span>
                <button onClick={() => onCopy(codeBlock)} className="flex items-center gap-1 hover:text-white">
                  <Icons.Copy size={12} /> Copy
                </button>
              </div>
              <pre className="mono overflow-x-auto p-3 text-xs text-cyan-100">{codeBlock.trim()}</pre>
            </div>
          );
        }
      }
      return <div>{elements}</div>;
    }

      function createNewChat() {
        const newId = `t-${Date.now()}`;
        setThreads((prev) => [
          {
            id: newId,
            title: "New Mentor Session",
            messages: [{ from: "ai", text: `Started a fresh session for **${student.targetCareer}**. What would you like to learn or debug today?` }],
          },
          ...prev,
        ]);
        setActiveId(newId);
      }

      async function streamLocalText(threadId, fullText) {
        const words = fullText.split(" ");
        let built = "";
        setThreads((prev) => prev.map((t) => t.id === threadId ? { ...t, messages: [...t.messages, { from: "ai", text: "" }] } : t));

        for (let i = 0; i < words.length; i++) {
          if (!mountedRef.current) return;
          built += (i === 0 ? "" : " ") + words[i];
          const snap = built;
          setThreads((prev) => prev.map((t) => {
            if (t.id !== threadId) return t;
            const copy = [...t.messages];
            copy[copy.length - 1] = { from: "ai", text: snap };
            return { ...t, messages: copy };
          }));
          await new Promise((r) => setTimeout(r, 16));
        }
      }

      async function sendMessage(overrideText) {
        const text = (typeof overrideText === "string" ? overrideText : draft).trim();
        if (!text || streaming) return;

        const targetThreadId = activeThread.id;
        setDraft("");
        setStreaming(true);

        const updatedHistory = [...activeThread.messages, { from: "user", text }];
        setThreads((prev) =>
          prev.map((t) =>
            t.id === targetThreadId
              ? { ...t, title: t.messages.length <= 1 ? text.slice(0, 28) : t.title, messages: updatedHistory }
              : t
          )
        );
        onLog(text);

        if (apiConfig.key.trim()) {
          try {
            setThreads((prev) => prev.map((t) => t.id === targetThreadId ? { ...t, messages: [...t.messages, { from: "ai", text: "" }] } : t));
            const res = await fetch(apiConfig.endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiConfig.key.trim()}` },
              body: JSON.stringify({
                model: apiConfig.model || "gpt-4o-mini",
                stream: true,
                messages: [
                  { role: "system", content: `You are SKILLNEXUS Personal AI Mentor. Student: ${student.name}, Target: ${student.targetCareer}, Readiness: ${readiness}/100, Skills: ${skills.map((s) => `${s.name}:${s.score}%`).join(", ")}.` },
                  ...updatedHistory.map((m) => ({ role: m.from === "user" ? "user" : "assistant", content: m.text })),
                ],
              }),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let full = "";
            while (true) {
              const { value, done } = await reader.read();
              if (done || !mountedRef.current) break;
              const lines = decoder.decode(value, { stream: true }).split("\n");
              for (let li = 0; li < lines.length; li++) {
                const line = lines[li].trim();
                if (line.indexOf("data: ") === 0 && line !== "data: [DONE]") {
                  try {
                    const parsed = JSON.parse(line.slice(6));
                    const delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content;
                    if (delta) {
                      full += delta;
                      const snap = full;
                      setThreads((prev) => prev.map((t) => {
                        if (t.id !== targetThreadId) return t;
                        const copy = [...t.messages];
                        copy[copy.length - 1] = { from: "ai", text: snap };
                        return { ...t, messages: copy };
                      }));
                    }
                  } catch (e) {}
                }
              }
            }
            if (mountedRef.current) setStreaming(false);
            return;
          } catch (err) {
            onToast(`Live API fallback (${err.message}). Using Smart Mentor.`);
            const fallbackReply = generateSmartMentorResponse(text, student, skills, roadmap, readiness);
            setThreads((prev) => prev.map((t) => t.id === targetThreadId ? { ...t, messages: t.messages.slice(0, -1) } : t));
            await streamLocalText(targetThreadId, fallbackReply);
            if (mountedRef.current) setStreaming(false);
            return;
          }
        }

        const smartReply = generateSmartMentorResponse(text, student, skills, roadmap, readiness);
        await streamLocalText(targetThreadId, smartReply);
        if (mountedRef.current) setStreaming(false);
      }

      useEffect(() => {
        if (initialPrompt) {
          sendMessage(initialPrompt);
          clearPrompt();
        }
      }, [initialPrompt]);

      return (
        <div className="space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <span className="eyebrow text-[#00E5FF]"><i /> CHATGPT-STYLE PERSONAL AI MENTOR</span>
              <h1 className="glow-dual text-2xl font-black">Conversational AI & Code Co-Pilot</h1>
            </div>
            <div className="flex items-center gap-2">
              <span className={`rounded-full border px-3 py-1 text-[10px] font-bold ${apiConfig.key.trim() ? "border-cyan-400/60 bg-cyan-400/15 text-cyan-300" : "border-purple-400/40 bg-purple-500/15 text-purple-200"}`}>
                {apiConfig.key.trim() ? "LIVE LLM STREAMING" : "SMART CONTEXTUAL MENTOR (DEMO)"}
              </span>
              <button onClick={() => setApiModal((v) => !v)} className="flex items-center gap-1.5 rounded-xl border border-slate-700 bg-[#080F24] px-3 py-1.5 text-xs font-bold text-cyan-300 hover:border-cyan-400">
                <Icons.Key size={13} /> Connect Live AI API
              </button>
            </div>
          </div>

          {apiModal && (
            <div className="vr-glass border-cyan-400/40">
              <div className="flex items-center justify-between">
                <h3 className="text-sm font-bold text-cyan-300">Optional: Connect Live OpenAI / Groq / OpenRouter Streaming</h3>
                <button onClick={() => setApiModal(false)}><Icons.X size={16} /></button>
              </div>
              <p className="mt-1 text-xs text-slate-400">Stored only in browser memory for this session. Leave blank to use the built-in Smart Contextual Mentor.</p>
              <div className="mt-3 grid gap-3 sm:grid-cols-3">
                <input type="password" value={apiConfig.key} onChange={(e) => setApiConfig({ ...apiConfig, key: e.target.value })} placeholder="sk-... (API Key)" className="rounded-xl border border-slate-700 bg-[#050711] px-3 py-2 text-xs outline-none focus:border-cyan-400" />
                <input value={apiConfig.endpoint} onChange={(e) => setApiConfig({ ...apiConfig, endpoint: e.target.value })} placeholder="API Endpoint URL" className="rounded-xl border border-slate-700 bg-[#050711] px-3 py-2 text-xs outline-none focus:border-cyan-400" />
                <input value={apiConfig.model} onChange={(e) => setApiConfig({ ...apiConfig, model: e.target.value })} placeholder="Model (e.g. gpt-4o-mini)" className="rounded-xl border border-slate-700 bg-[#050711] px-3 py-2 text-xs outline-none focus:border-cyan-400" />
              </div>
            </div>
          )}

          <div className="grid gap-5 lg:grid-cols-12">
            <div className="vr-glass flex flex-col justify-between lg:col-span-4">
              <div>
                <button onClick={createNewChat} className="btn-vr mb-4 flex w-full items-center justify-center gap-2 py-2.5 text-xs">
                  <Icons.Plus size={15} /> New Chat Session
                </button>
                <span className="eyebrow text-slate-400"><i /> CHAT HISTORY</span>
                <div className="mt-2.5 space-y-1.5">
                  {threads.map((t) => (
                    <button
                      key={t.id}
                      onClick={() => setActiveId(t.id)}
                      className={`w-full truncate rounded-xl border px-3 py-2.5 text-left text-xs font-semibold transition ${
                        t.id === activeThread.id ? "border-[#00E5FF] bg-cyan-400/15 text-white" : "border-slate-800 bg-[#050711]/70 text-slate-400 hover:border-slate-700"
                      }`}
                    >
                      {t.title}
                    </button>
                  ))}
                </div>

                <span className="eyebrow mt-5 text-purple-300"><i /> QUICK PROMPTS</span>
                <div className="mt-2 space-y-1.5">
                  {[
                    "How do I fix my SQL & RLS gap?",
                    "Give me a React custom hook example",
                    "Create my weekly study plan",
                    "Suggest a portfolio project for me",
                    "Ask me a mock interview question",
                  ].map((p) => (
                    <button key={p} onClick={() => sendMessage(p)} className="w-full rounded-xl border border-slate-800 bg-[#050711]/75 px-3 py-2 text-left text-[11px] text-slate-300 hover:border-cyan-400">
                      {p}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="vr-glass flex h-[540px] flex-col lg:col-span-8">
              <div className="flex-1 space-y-4 overflow-y-auto pr-2">
                {activeThread.messages.map((m, i) => (
                  <div key={i} className={`flex ${m.from === "user" ? "justify-end" : "justify-start"}`}>
                    <div className={`max-w-[88%] rounded-2xl px-4 py-3 ${
                      m.from === "user"
                        ? "bg-gradient-to-r from-[#00E5FF] to-[#8B5CF6] text-sm font-semibold text-[#050711]"
                        : "border border-slate-800 bg-[#050711]/90 text-[#EAF6FF]"
                    }`}>
                      {m.from === "user" ? (
                        <p>{m.text}</p>
                      ) : (
                        <RichMessageRenderer
                          text={m.text || "..."}
                          onCopy={(code) => {
                            if (navigator.clipboard) navigator.clipboard.writeText(code);
                            onToast("Code copied to clipboard!");
                          }}

                {streaming && <p className="text-xs italic text-cyan-300">AI Mentor is streaming response...</p>}
                <div ref={chatEndRef} />

              <form onSubmit={(e) => { e.preventDefault(); sendMessage(); }} className="mt-4 flex gap-2">
                <input

                />
                <button disabled={streaming || !draft.trim()} type="submit" className="btn-vr px-5 disabled:opacity-40">
                  <Icons.Send size={16} />

            </div>
          </div>
        </div>
      );

    // ---------------- INTERACTIVE 3D SKILL CONSTELLATION ----------------
    function SkillConstellation3D({ skills, targetCareer, readiness, height = 300, onSelectSkill, lowMotion = false }) {
      const canvasRef = useRef(null);
      const pointer = useRef({ rx: 0.2, ry: 0.3 });
      const [hovered, setHovered] = useState(null);

      const nodes = useMemo(() => [
        { id: "core", label: targetCareer, score: readiness, status: "target", color: "#1677FF", x: 0, y: 0, z: 0 },
        ...skills.map((s, i) => {
          const ang = (i / skills.length) * Math.PI * 2;
          const isGap = s.score < 58;
          return {
            ...s, id: s.name, label: s.name,
            status: isGap ? "missing" : "active",
            color: isGap ? "#8B5CF6" : "#00E5FF",
            x: Math.cos(ang) * 126, y: Math.sin(ang) * 92, z: (i % 2 === 0 ? 1 : -1) * 65,
          };
        }),
      ], [skills, targetCareer, readiness]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        let animId = 0, t = 0, projected = [];

        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener("resize", resize);

        const onMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          pointer.current.ry = ((e.clientX - rect.left) / rect.width - 0.5) * 1.7;
          pointer.current.rx = -((e.clientY - rect.top) / rect.height - 0.5) * 1.2;
          const mx = e.clientX - rect.left, my = e.clientY - rect.top;
          const hit = projected.find((p) => Math.hypot(p.sx - mx, p.sy - my) < 24 * p.scale);
          setHovered(hit ? hit.node : null);
        };

        const onClick = (e) => {
          const rect = canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left, my = e.clientY - rect.top;
          const hit = projected.find((p) => Math.hypot(p.sx - mx, p.sy - my) < 26 * p.scale);
          if (hit && onSelectSkill) onSelectSkill(hit.node);
        };

        canvas.addEventListener("pointermove", onMove);
        canvas.addEventListener("click", onClick);

        const render = () => {
          if (!lowMotion) t += 0.012;
          const w = canvas.clientWidth, h = canvas.clientHeight;
          ctx.clearRect(0, 0, w, h);

          const angleY = t * 0.45 + pointer.current.ry;
          const angleX = Math.sin(t * 0.4) * 0.16 + pointer.current.rx;
          const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
          const cosX = Math.cos(angleX), sinX = Math.sin(angleX);

          ctx.save();
          ctx.translate(w / 2, h / 2);
          ctx.strokeStyle = "rgba(0, 229, 255, 0.18)";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.ellipse(0, 0, Math.min(w, h) * 0.42, Math.min(w, h) * 0.17, angleY * 0.25, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          const fov = 350;
          projected = nodes.map((node) => {
            const x1 = node.x * cosY - node.z * sinY;
            const z1 = node.z * cosY + node.x * sinY;
            const y2 = node.y * cosX - z1 * sinX;
            const z2 = z1 * cosX + node.y * sinX;
            const scale = fov / (fov + z2 + 165);
            return { node, sx: w / 2 + x1 * scale, sy: h / 2 + y2 * scale, scale, z: z2 };
          });

          for (let i = 1; i < projected.length; i++) {
            const a = projected[0], b = projected[i];
            const next = projected[(i % (projected.length - 1)) + 1];
            [[a, b], [b, next]].forEach(([p1, p2], idx) => {
              const grad = ctx.createLinearGradient(p1.sx, p1.sy, p2.sx, p2.sy);
              grad.addColorStop(0, p1.node.color + "88");
              grad.addColorStop(1, p2.node.color + "88");
              ctx.strokeStyle = grad;
              ctx.lineWidth = 1.4;
              ctx.beginPath();
              ctx.moveTo(p1.sx, p1.sy);
              ctx.lineTo(p2.sx, p2.sy);
              ctx.stroke();

              if (!lowMotion) {
                const prog = (t * 0.65 + i * 0.2 + idx * 0.35) % 1;
                ctx.fillStyle = "#EAF6FF";
                ctx.beginPath();
                ctx.arc(p1.sx + (p2.sx - p1.sx) * prog, p1.sy + (p2.sy - p1.sy) * prog, 2.2, 0, Math.PI * 2);
                ctx.fill();
              }
            });
          }

          [...projected].sort((a, b) => b.z - a.z).forEach(({ node, sx, sy, scale }) => {
            const r = (node.id === "core" ? 16 : 11) * scale;
            const glow = ctx.createRadialGradient(sx, sy, 1, sx, sy, r * 2.8);
            glow.addColorStop(0, node.color + "CC");
            glow.addColorStop(1, node.color + "00");
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(sx, sy, r * 2.8, 0, Math.PI * 2);
            ctx.fill();

            const sphere = ctx.createRadialGradient(sx - r * 0.3, sy - r * 0.3, 1, sx, sy, r);
            sphere.addColorStop(0, "#EAF6FF");
            sphere.addColorStop(0.45, node.color);
            sphere.addColorStop(1, "#050711");
            ctx.fillStyle = sphere;
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.font = `600 ${Math.max(9, Math.round(11 * scale))}px Inter, sans-serif`;
            ctx.fillStyle = "#EAF6FF";
            ctx.textAlign = "center";
            ctx.fillText(`${node.label} (${node.score}%)`, sx, sy + r + 14);
          });

          animId = requestAnimationFrame(render);
        };
        animId = requestAnimationFrame(render);
        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener("resize", resize);
          canvas.removeEventListener("pointermove", onMove);
          canvas.removeEventListener("click", onClick);
        };
      }, [nodes, lowMotion]);

      return (
        <div className="relative w-full select-none" style={{ height }}>
          <canvas ref={canvasRef} className="h-full w-full cursor-pointer" />
          {hovered && (
            <div className="pointer-events-none absolute bottom-3 left-3 rounded-xl border border-cyan-400/40 bg-[#050711]/90 px-3 py-1.5 text-xs backdrop-blur-md">
              <span className="glow-dual-soft font-bold">{hovered.label}</span> · {hovered.score}%
              {hovered.status === "missing" && <span className="ml-2 text-purple-300">(Gap Highlighted)</span>}
            </div>
          )}
        </div>
      );
    }

    // ---------------- 3D MAGNETIC GLASS CARD ----------------
    function HoloCard3D({ children, className = "", lowMotion = false }) {
      const ref = useRef(null);
      const [tilt, setTilt] = useState({ t: "rotateX(0deg) rotateY(0deg)", gx: 50, gy: 50 });

      const onMove = (e) => {
        if (lowMotion || !ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        setTilt({
          t: `rotateX(${((0.5 - py) * 9).toFixed(2)}deg) rotateY(${((px - 0.5) * 9).toFixed(2)}deg) translateZ(6px)`,
          gx: px * 100, gy: py * 100,
        });
      };

      return (
        <div
          ref={ref}
          onMouseMove={onMove}
          onMouseLeave={() => setTilt({ t: "rotateX(0deg) rotateY(0deg)", gx: 50, gy: 50 })}
          className={`vr-glass holo-rim overflow-hidden ${className}`}
          style={{ transform: tilt.t, transformStyle: "preserve-3d" }}
        >
          <div className="pointer-events-none absolute inset-0 opacity-35" style={{ background: `radial-gradient(circle at ${tilt.gx}% ${tilt.gy}%, rgba(0, 229, 255, 0.24), transparent 55%)` }} />
          <div className="relative z-10">{children}</div>
        </div>
      );
    }

    // ---------------- CHARTS ----------------
    function RadarChartSVG({ skills }) {
      const cx = 140, cy = 125, r = 82, count = skills.length;
      const point = (idx, val) => {
        const ang = (Math.PI * 2 * idx) / count - Math.PI / 2;
        return [cx + Math.cos(ang) * ((val / 100) * r), cy + Math.sin(ang) * ((val / 100) * r)];
      };
      const poly = (vals) => vals.map((v, i) => point(i, v).join(",")).join(" ");

      return (
        <svg viewBox="0 0 280 250" className="h-[225px] w-full">
          {[25, 50, 75, 100].map((ring) => (
            <polygon key={ring} points={poly(skills.map(() => ring))} fill="none" stroke="rgba(234,246,255,0.12)" strokeDasharray="3 3" />
          ))}
          {skills.map((s, i) => {
            const [lx, ly] = point(i, 118);
            const [ax, ay] = point(i, 100);
            return (
              <g key={s.name}>
                <line x1={cx} y1={cy} x2={ax} y2={ay} stroke="rgba(234,246,255,0.12)" />
                <text x={lx} y={ly} fill="#EAF6FF" fontSize="9.5" fontWeight="600" textAnchor="middle" dominantBaseline="middle">{s.name}</text>

            );

          <polygon points={poly(skills.map((s) => s.score))} fill="rgba(0,229,255,0.24)" stroke="#00E5FF" strokeWidth="2.2" />
          {skills.map((s, i) => {

            return <circle key={s.name} cx={px} cy={py} r="4" fill="#00E5FF" stroke="#050711" strokeWidth="1.5" />;
          })}
        </svg>
      );
    }

    function AreaChartSVG({ data, dataKey = "minutes", stroke = "#00E5FF" }) {
      const w = 360, h = 150, pad = 22;
      const maxVal = Math.max(...data.map((d) => d[dataKey]), 100);
      const pts = data.map((d, i) => ({
        x: pad + (i / (data.length - 1)) * (w - pad * 2),
        y: h - pad - (d[dataKey] / maxVal) * (h - pad * 2),
        label: d.day,
      }));
      const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
      const areaPath = `${linePath} L ${pts[pts.length - 1].x} ${h - pad} L ${pts[0].x} ${h - pad} Z`;

      return (
        <svg viewBox={`0 0 ${w} ${h}`} className="h-[170px] w-full">
          <defs>
            <linearGradient id={`vrgrad-${dataKey}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={stroke} stopOpacity="0.45" />
              <stop offset="100%" stopColor={stroke} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={areaPath} fill={`url(#vrgrad-${dataKey})`} />
          <path d={linePath} fill="none" stroke={stroke} strokeWidth="2.8" strokeLinecap="round" />
          {pts.map((p) => (
            <g key={p.label}>
              <circle cx={p.x} cy={p.y} r="3.8" fill="#EAF6FF" stroke={stroke} strokeWidth="2" />
              <text x={p.x} y={h - 5} fill="#94a3b8" fontSize="9" textAnchor="middle">{p.label}</text>
            </g>
          ))}
        </svg>
      );
    }

                            </span>
                          </div>
                        </div>

                                  onClick={() => setRoadmap((r) => r.map((x) => x.id === c.id ? { ...x, done: !x.done } : x))}

                                  Study →
                                </button>
                              </div>

                            <div key={s.name}>

                  {page === "roadmap" && (
                    <div className="space-y-6">

                    </div>
                  )}

                  {page === "study" && (
                    <CourseStudyPage
                      course={activeCourse}
                      lowMotion={lowMotion}

                  )}

                  {page === "mentor" && (
                    <MentorPage
                      student={student}
                      skills={skills}
                      roadmap={roadmap}
                      readiness={readiness}
                      initialPrompt={mentorPrompt}

                  {page === "analytics" && <AnalyticsPage lowMotion={lowMotion} skills={skills} history={history} readiness={readiness} weeklyGoal={student.weeklyGoal} />}
                  {page === "settings" && <SettingsPage student={student} setStudent={setStudent} lowMotion={lowMotion} setLowMotion={setLowMotion} onToast={setToast} onLogout={handleLogout} />}

              </main>

          )}

          {toast && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2 rounded-2xl border border-cyan-400/50 bg-[#050711]/95 px-4 py-3 text-xs font-bold text-cyan-200 shadow-2xl backdrop-blur-xl">
              <Icons.Check size={16} className="text-cyan-400" /> {toast}
            </div>
          )}
        </div>
      );
    }

    // ---------------- AUTH SCREEN ----------------
    function AuthScreen({ lowMotion, onBack, onSuccess }) {
      const [mode, setMode] = useState("login");
      const [name, setName] = useState("");
      const [email, setEmail] = useState("alex.johnson@university.edu");
      const [pass, setPass] = useState("demo1234");
      const [show, setShow] = useState(false);
      const [err, setErr] = useState("");

      const submit = (e) => {
        e.preventDefault();
        setErr("");
        if (email.indexOf("@") === -1 || pass.length < 6) {
          return setErr("Enter a valid email and a password of at least 6 characters.");
        }
        if (mode === "register") {
          if (name.trim().length < 2) return setErr("Please enter your full name.");
          try { localStorage.setItem("skillnexus_creds", JSON.stringify({ email, pass, name })); } catch (ex) {}
          onSuccess(email, name, true);
          return;
        }
        try {
          const saved = localStorage.getItem("skillnexus_creds");
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.email === email && parsed.pass !== pass) {
              return setErr("Incorrect password for this registered account.");
            }
            return onSuccess(email, parsed.name || "Alex Johnson", false);
          }
        } catch (ex) {}
        onSuccess(email, "Alex Johnson", false);
      };

      return (
        <div className="page-transition-3d relative z-10 flex min-h-screen items-center justify-center px-4">
          <HoloCard3D lowMotion={lowMotion} className="w-full max-w-md">
            <button onClick={onBack} className="mb-4 text-xs text-slate-400 hover:text-cyan-300">← Back to 3D Landing</button>
            <div className="mb-5 flex rounded-xl bg-[#050711] p-1">
              <button onClick={() => { setMode("login"); setErr(""); }} className={`flex-1 rounded-lg py-2 text-xs font-bold ${mode === "login" ? "bg-[#00E5FF] text-[#050711]" : "text-slate-400"}`}>Login</button>
              <button onClick={() => { setMode("register"); setErr(""); }} className={`flex-1 rounded-lg py-2 text-xs font-bold ${mode === "register" ? "bg-[#00E5FF] text-[#050711]" : "text-slate-400"}`}>Register</button>
            </div>
            <h2 className="glow-dual text-2xl font-black">{mode === "register" ? "Create AI Account" : "Sign In to SKILLNEXUS"}</h2>
            <p className="mt-1 text-xs text-slate-400">Your session persists across reloads until you log out.</p>
            <form onSubmit={submit} className="mt-4 space-y-3.5">
              {mode === "register" && <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Full Name" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3.5 py-2.5 text-sm outline-none focus:border-cyan-400" />}
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email address" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3.5 py-2.5 text-sm outline-none focus:border-cyan-400" />
              <div className="relative">
                <input type={show ? "text" : "password"} value={pass} onChange={(e) => setPass(e.target.value)} placeholder="Password (6+ chars)" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3.5 py-2.5 pr-10 text-sm outline-none focus:border-cyan-400" />
                <button type="button" onClick={() => setShow(!show)} className="absolute right-3 top-2.5 text-slate-400"><Icons.Eye size={17} /></button>
              </div>
              {err && <p className="rounded-lg bg-rose-500/15 px-3 py-2 text-xs text-rose-300">{err}</p>}
              <button type="submit" className="btn-vr w-full py-3 text-sm">{mode === "register" ? "Register & Calibrate →" : "Sign In →"}</button>
              <button type="button" onClick={() => onSuccess("google-student@skillnexus.ai", "Alex Johnson", false)} className="w-full rounded-xl border border-slate-700 bg-[#080F24] py-2.5 text-xs font-semibold hover:border-cyan-400">Continue with Google (Demo UI)</button>
            </form>
          </HoloCard3D>
        </div>
      );
    }

    function OnboardingScreen({ lowMotion, student, onFinish }) {
      const [step, setStep] = useState(1);
      const [form, setForm] = useState(student);
      return (
        <div className="page-transition-3d relative z-10 flex min-h-screen items-center justify-center px-4">
          <HoloCard3D lowMotion={lowMotion} className="w-full max-w-xl">
            <span className="eyebrow glow-dual-soft"><i /> STEP {step} OF 3 · NEURAL CALIBRATION</span>
            {step === 1 && (
              <div className="mt-4 space-y-3">
                <h2 className="glow-dual text-2xl font-bold">Student Identity</h2>
                <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Name" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2.5 text-sm" />
                <input value={form.education} onChange={(e) => setForm({ ...form, education: e.target.value })} placeholder="Education" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2.5 text-sm" />
                <input value={form.department} onChange={(e) => setForm({ ...form, department: e.target.value })} placeholder="Department" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2.5 text-sm" />
              </div>
            )}
            {step === 2 && (
              <div className="mt-4 space-y-3">
                <h2 className="glow-dual text-2xl font-bold">Certifications & Projects</h2>
                <input value={form.certifications} onChange={(e) => setForm({ ...form, certifications: e.target.value })} placeholder="Certifications" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2.5 text-sm" />
                <textarea value={form.projects} onChange={(e) => setForm({ ...form, projects: e.target.value })} rows={3} placeholder="Existing projects" className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2.5 text-sm" />
              </div>
            )}
            {step === 3 && (
              <div className="mt-4 space-y-3">
                <h2 className="glow-dual text-2xl font-bold">Target Career Constellation</h2>
                <select value={form.targetCareer} onChange={(e) => setForm({ ...form, targetCareer: e.target.value })} className="w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2.5 text-sm">
                  {CAREERS.map((c) => <option key={c.name}>{c.name}</option>)}
                </select>
              </div>
            )}
            <div className="mt-6 flex justify-between">
              <button disabled={step === 1} onClick={() => setStep(step - 1)} className="text-sm text-slate-400 disabled:opacity-40">Back</button>
              {step < 3 ? <button onClick={() => setStep(step + 1)} className="btn-vr px-5 py-2 text-sm">Next →</button> : <button onClick={() => onFinish(form)} className="btn-vr px-5 py-2 text-sm">Launch Command Center ✦</button>}
            </div>
          </HoloCard3D>
        </div>
      );
    }

    function CareersPage({ lowMotion, query, setQuery, current, onSelect }) {
      const [cat, setCat] = useState("All");
      const list = CAREERS.filter((c) => (cat === "All" || c.category === cat) && `${c.name} ${c.skills.join(" ")}`.toLowerCase().indexOf(query.toLowerCase()) !== -1);
      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-end justify-between gap-4">
            <div>
              <span className="eyebrow glow-dual-soft"><i /> CAREER ADVISOR</span>
              <h1 className="glow-dual text-3xl font-black">Explore Career Constellations</h1>
            </div>
            <div className="flex flex-wrap gap-2">
              {["All", "Engineering", "Intelligence", "Infrastructure", "Creative tech"].map((c) => (
                <button key={c} onClick={() => setCat(c)} className={`rounded-xl px-3 py-1.5 text-xs font-bold ${cat === c ? "bg-[#00E5FF] text-[#050711]" : "bg-[#080F24] text-slate-400"}`}>{c}</button>
              ))}
            </div>
          </div>
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search role or skill..." className="w-full rounded-xl border border-slate-800 bg-[#050711]/80 px-4 py-2.5 text-sm outline-none focus:border-cyan-400" />
          <div className="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
            {list.map((c) => {
              const active = c.name === current;
              return (
                <HoloCard3D lowMotion={lowMotion} key={c.name} className={active ? "ring-2 ring-[#00E5FF]" : ""}>
                  <div className="flex justify-between">
                    <span className="rounded-lg bg-[#050711] px-2.5 py-1 text-[10px] font-bold text-cyan-300">{c.tag}</span>
                    <span className="glow-dual-soft text-sm font-black">{c.score}% MATCH</span>
                  </div>
                  <h3 className="glow-word-white mt-3 text-xl font-bold">{c.name}</h3>
                  <p className="text-xs text-slate-400">{c.category}</p>
                  <div className="mt-3 flex flex-wrap gap-1.5">
                    {c.skills.map((s) => <span key={s} className="rounded bg-slate-800/80 px-2 py-0.5 text-[11px]">{s}</span>)}
                  </div>
                  <button onClick={() => onSelect(c.name)} className={`mt-5 w-full py-2.5 text-xs ${active ? "rounded-xl bg-[#00E5FF] font-bold text-[#050711]" : "btn-vr"}`}>
                    {active ? "Active Target Path ✓" : "Switch Target & Adapt Universe"}
                  </button>
                </HoloCard3D>
              );
            })}
          </div>
        </div>
      );
    }

    function RoadmapPage({ tasks, career, onOpenCourse, onToggle }) {
      const [stage, setStage] = useState("All");
      const visible = tasks.filter((t) => stage === "All" || t.stage === stage);
      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div>
              <span className="eyebrow glow-dual-soft"><i /> ADAPTIVE TIMELINE · {career.toUpperCase()}</span>
              <h1 className="glow-dual text-3xl font-black">Roadmap Courses</h1>
            </div>
            <div className="flex gap-1.5 rounded-xl bg-[#080F24] p-1 text-xs">
              {["All", "Beginner", "Intermediate", "Advanced"].map((s) => (
                <button key={s} onClick={() => setStage(s)} className={`rounded-lg px-3 py-1.5 ${stage === s ? "bg-[#00E5FF] font-bold text-[#050711]" : "text-slate-400"}`}>{s}</button>
              ))}
            </div>
          </div>
          <div className="space-y-4">
            {visible.map((t) => (
              <div key={t.id} className="vr-glass flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
                <div>
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="rounded bg-cyan-400/15 px-2 py-0.5 text-[10px] font-bold text-cyan-300">WEEK 0{t.week} · {t.stage.toUpperCase()}</span>
                    {t.adaptive && <span className="rounded bg-purple-500/25 px-2 py-0.5 text-[10px] font-bold text-purple-300">AI ADAPTED</span>}
                    <span className="text-xs text-slate-400">{t.duration}</span>
                  </div>
                  <h3 className="glow-word-white mt-2 text-lg font-bold">{t.title}</h3>
                  <p className="text-sm text-slate-400">{t.subtitle}</p>
                  <p className="mt-2 rounded-lg border border-purple-500/30 bg-purple-500/10 px-3 py-1.5 text-xs text-purple-200">
                    <strong>Why recommended:</strong> {t.explanation}
                  </p>
                </div>
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => onOpenCourse(t)} className="btn-vr px-4 py-2 text-xs">Open Classroom →</button>
                  <button onClick={() => onToggle(t.id)} className={t.done ? "rounded-xl bg-[#00E5FF] px-4 py-2 text-xs font-bold text-[#050711]" : "rounded-xl border border-slate-700 px-4 py-2 text-xs text-slate-300 hover:border-cyan-400"}>
                    {t.done ? "Completed ✓" : "Mark Done"}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AssessmentsPage({ lowMotion, history, onSubmit }) {
      const [choice, setChoice] = useState(null);
      const [code, setCode] = useState("function twoSum(nums, target) {\n  const map = new Map();\n  return [0, 1];\n}");
      const options = [
        "Using parameterized queries ($1) and Row Level Security",
        "Concatenating raw req.body directly into SQL strings",
        "Storing database passwords inside React state",
        "Disabling authentication checks on endpoints",
      ];

      return (
        <div className="space-y-6">
          <span className="eyebrow glow-dual-soft"><i /> ASSESSMENT EVALUATOR</span>
          <h1 className="glow-dual text-3xl font-black">Adaptive Quiz & Coding Sandbox</h1>
          <div className="grid gap-5 lg:grid-cols-2">
            <HoloCard3D lowMotion={lowMotion}>
              <span className="eyebrow text-cyan-300"><i /> MCQ · DATA & SQL SECURITY</span>
              <h2 className="glow-word-white mt-2 text-lg font-bold">Which practice prevents SQL injection and enforces student data isolation?</h2>
              <div className="mt-4 space-y-2">
                {options.map((o, i) => (
                  <button key={o} onClick={() => setChoice(i)} className={`w-full rounded-xl border p-3 text-left text-xs ${choice === i ? "border-cyan-400 bg-cyan-400/20" : "border-slate-800 bg-[#050711]/70"}`}>{o}</button>
                ))}
              </div>
              <button disabled={choice === null} onClick={() => onSubmit("Data & SQL", "SQL & RLS Security Check", choice === 0 ? 94 : 46, choice === 0 ? "Query Optimization" : "Parameterized SQL & RLS")} className="btn-vr mt-4 w-full py-2.5 text-xs disabled:opacity-40">
                Submit & Trigger Adaptive Update
              </button>
            </HoloCard3D>
            <div className="vr-glass">
              <span className="eyebrow text-cyan-300"><i /> CODING SANDBOX</span>
              <textarea value={code} onChange={(e) => setCode(e.target.value)} rows={7} className="mono mt-3 w-full rounded-xl border border-slate-800 bg-[#050711] p-3 text-xs text-cyan-200 outline-none focus:border-cyan-400" />
              <button onClick={() => onSubmit("JavaScript", "Two-Sum Code Challenge", code.indexOf("Map") !== -1 ? 92 : 64, "O(n) HashMap Lookup")} className="btn-vr mt-3 px-5 py-2.5 text-xs">
                Evaluate Code with AI Agent
              </button>
            </div>
          </div>
          <div className="vr-glass">
            <h3 className="glow-dual-soft font-bold">Assessment Results</h3>
            <div className="mt-3 grid gap-3 sm:grid-cols-3">
              {history.map((h, i) => (
                <div key={i} className="rounded-xl border border-slate-800 bg-[#050711]/75 p-3">
                  <p className="text-xs text-slate-400">{h.date} · {h.skill}</p>
                  <p className="font-bold">{h.title}</p>
                  <p className="glow-dual-soft mt-1 text-xl font-black">{h.score}%</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    function ProjectsPage({ lowMotion, onToast }) {
      const [lvl, setLvl] = useState("All");
      const list = [
        { title: "Campus Connect VR", desc: "Real-time study rooms with spatial presence.", level: "Intermediate", tags: ["React", "Three.js", "Supabase"] },
        { title: "Spendwise Analytics", desc: "Personal finance charts with adaptive alerts.", level: "Beginner", tags: ["TypeScript", "SVG Charts", "SQL"] },
        { title: "Prompt Garden AI", desc: "Multi-agent prompt workflow studio.", level: "Advanced", tags: ["AI Agents", "Edge Functions"] },
      ].filter((p) => lvl === "All" || p.level === lvl);

      return (
        <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-4">
            <div>
              <span className="eyebrow glow-dual-soft"><i /> PROJECT LAB</span>
              <h1 className="glow-dual text-3xl font-black">Build Portfolio-Ready Systems</h1>
            </div>
            <div className="flex gap-2">
              {["All", "Beginner", "Intermediate", "Advanced"].map((l) => (
                <button key={l} onClick={() => setLvl(l)} className={`rounded-xl px-3 py-1.5 text-xs ${lvl === l ? "bg-[#00E5FF] font-bold text-[#050711]" : "bg-[#080F24] text-slate-400"}`}>{l}</button>
              ))}
            </div>
          </div>
          <div className="grid gap-5 md:grid-cols-3">
            {list.map((p) => (
              <HoloCard3D lowMotion={lowMotion} key={p.title}>
                <span className="eyebrow text-purple-300"><i /> {p.level.toUpperCase()}</span>
                <h3 className="glow-word-white mt-2 text-xl font-bold">{p.title}</h3>
                <p className="mt-2 text-sm text-slate-400">{p.desc}</p>
                <div className="mt-4 flex flex-wrap gap-1.5">
                  {p.tags.map((t) => <span key={t} className="rounded bg-slate-800/80 px-2 py-0.5 text-[11px]">{t}</span>)}
                </div>
                <div className="mt-5 flex gap-2">
                  <button onClick={() => onToast(`Started "${p.title}" workspace.`)} className="btn-vr flex-1 py-2 text-xs">Start Build</button>
                  <a href="https://github.com" target="_blank" rel="noreferrer" className="rounded-xl border border-slate-700 px-3 py-2 text-xs hover:border-cyan-400">GitHub ↗</a>
                </div>
              </HoloCard3D>
            ))}
          </div>
        </div>
      );
    }

    function AnalyticsPage({ lowMotion, skills, history, readiness, weeklyGoal }) {
      return (
        <div className="space-y-6">
          <span className="eyebrow glow-dual-soft"><i /> PROGRESS MENTOR ANALYTICS</span>
          <h1 className="glow-dual text-3xl font-black">Readiness & Learning Velocity</h1>
          <div className="grid gap-4 sm:grid-cols-4">
            {[
              { l: "Readiness Score", v: `${readiness}/100` },
              { l: "Assessments", v: history.length },
              { l: "Skills Tracked", v: skills.length },
              { l: "Weekly Goal", v: `${weeklyGoal} hrs` },
            ].map((k) => (
              <HoloCard3D lowMotion={lowMotion} key={k.l}>
                <p className="text-xs text-slate-400">{k.l}</p>
                <p className="glow-dual mt-2 text-3xl font-black">{k.v}</p>
              </HoloCard3D>
            ))}
          </div>
          <div className="vr-glass">
            <h2 className="glow-dual-soft mb-2 font-bold">7-Day Career Readiness Trajectory</h2>
            <AreaChartSVG stroke="#8B5CF6" dataKey="readiness" data={[
              { day: "MON", readiness: 64 }, { day: "TUE", readiness: 66 }, { day: "WED", readiness: 67 },
              { day: "THU", readiness: 69 }, { day: "FRI", readiness: 70 }, { day: "SAT", readiness: 72 }, { day: "SUN", readiness },
            ]} />
          </div>
        </div>
      );
    }

    function SettingsPage({ student, setStudent, lowMotion, setLowMotion, onToast, onLogout }) {
      return (
        <div className="space-y-6">
          <span className="eyebrow glow-dual-soft"><i /> SYSTEM & VR PREFERENCES</span>
          <h1 className="glow-dual text-3xl font-black">Account & Performance Controls</h1>
          <div className="grid gap-5 lg:grid-cols-2">
            <div className="vr-glass space-y-4">
              <label className="block text-xs">Full Name<input value={student.name} onChange={(e) => setStudent({ ...student, name: e.target.value })} className="mt-1 w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2 text-sm" /></label>
              <label className="block text-xs">Department<input value={student.department} onChange={(e) => setStudent({ ...student, department: e.target.value })} className="mt-1 w-full rounded-xl border border-slate-700 bg-[#050711] px-3 py-2 text-sm" /></label>
              <label className="block text-xs">Weekly Goal ({student.weeklyGoal} hrs)
                <input type="range" min="2" max="24" value={student.weeklyGoal} onChange={(e) => setStudent({ ...student, weeklyGoal: Number(e.target.value) })} className="mt-2 w-full accent-cyan-400" />
              </label>
              <div className="flex gap-3">
                <button onClick={() => onToast("Preferences saved.")} className="btn-vr px-5 py-2.5 text-xs">Save Preferences</button>
                <button onClick={onLogout} className="rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-2.5 text-xs font-bold text-rose-300 hover:bg-rose-500/20">Logout Session</button>
              </div>
            </div>
            <div className="vr-glass space-y-4">
              <h2 className="glow-dual-soft font-bold">3D & Accessibility Mode</h2>
              <button onClick={() => setLowMotion((v) => !v)} className="w-full rounded-xl border border-cyan-400/40 bg-[#050711] px-4 py-3 text-left text-xs font-semibold">
                {lowMotion ? "Currently: 2D Lightweight Mode (Click to enable 3D)" : "Currently: Full Three.js 3D Mode (Click for 2D Fallback)"}
              </button>
              <p className="text-xs text-slate-400">
                Respects reduced-motion settings automatically. Ready to publish on Netlify Drop, Vercel, or GitHub Pages.
              </p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
